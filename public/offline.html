<!doctype html>
<html lang="fa" dir="rtl">
  <head>

        padding: 10px 20px;
        border-radius: 10px;
        border: none;

        color: white;
        font-weight: 700;
        font-size: 0.9rem;

      }

  <body>
    <div class="box">
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>به نظر می‌رسد آفلاین هستید. لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.</p>
      <button onclick="location.reload()">تلاش مجدد</button>
    </div>

</html>
